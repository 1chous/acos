# Default scenario: a small office building during a quiet hour.
# Every option here can also be given on the command line, where
# underscores turn into dashes: start_floors -> --start-floors.

floors       = 12
elevators    = 3
capacity     = 6

# where the cabins stand before the first call
start_floors = 1 5 9

# random passengers: how many, and the gap between two of them
passengers   = 25
arrival_min  = 2
arrival_max  = 8

# timings, in ticks
travel_ticks = 2
door_ticks   = 1
board_ticks  = 1
alight_ticks = 1

# fcfs or nearest
strategy     = nearest

seed         = 0      # 0 takes the seed from the clock
max_ticks    = 0      # 0 means run until everybody is delivered
delay_ms     = 200

log          = elevator.log
