# Default scenario: a small office building during a quiet hour.
# Every option here can also be given on the command line, where
# underscores turn into dashes: start_floors -> --start-floors.

floors         = 12
elevators      = 3
capacity       = 6

# where the cabins stand before the first call
start_floors   = 1 5 9

# how many passengers appear, and the gap between two of them
passengers     = 25
arrival_min_ms = 500
arrival_max_ms = 2500

# how long the cabin needs for each action
travel_ms      = 400
door_ms        = 400
board_ms       = 250
alight_ms      = 250

# fcfs or nearest
strategy       = nearest

seed           = 0      # 0 takes the seed from the clock
max_seconds    = 0      # 0 means run until everybody is delivered
refresh_ms     = 100

log            = elevator.log
